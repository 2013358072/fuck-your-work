name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Mac executable
        if: matrix.platform == 'mac'
        run: node scripts/verify-package.cjs "dist/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/上班鼓励器.app/Contents/MacOS/上班鼓励器"
      - name: Verify Windows install and reinstall
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          - 精简主页：移除加班卡片及开始加班、补记、记录入口。
          - 移除上班状态标签、底部鼓励文案和常规存储目录提示。
          - 缩小主窗口，保留工资展示、发薪周期、悬浮窗、置顶和更新通知。
          - 保留已有设置、加班记录和长期调休余额，可通过备份导出。

          提供 macOS Apple Silicon / Intel 的 DMG、ZIP，以及 Windows x64 安装版和便携版。
          安装包尚未进行 Apple 公证或 Windows 可信代码签名，系统可能提示未知发布者。更新需下载后确认安装。
          NOTES
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "上班鼓励器 $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
          # Keep the release in draft until every installer is completely uploaded.
          for asset in installers/*; do
            name=$(basename "$asset")
            size=$(stat -c%s "$asset")
            for attempt in 1 2 3 4 5; do
              remote=$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name == \"$name\") | .size" 2>/dev/null || true)
              if [ "$remote" = "$size" ]; then break; fi
              gh release upload "$GITHUB_REF_NAME" "$asset" --clobber || true
              sleep 5
            done
            remote=$(gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name == \"$name\") | .size")
            [ "$remote" = "$size" ] || { echo "Upload incomplete: $name"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "$RUNNER_TEMP/release-notes.txt"
